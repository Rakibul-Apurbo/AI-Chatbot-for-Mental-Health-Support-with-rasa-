version: "3.1"

rules:

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_iamabot


  # New rule: If the user expresses self-harm or suicidal ideation, gently recommend professional help.
- rule: Handle self-harm and suicidal ideation    
  steps:
  - intent: self_harm
  - action: utter_self_harm_help

