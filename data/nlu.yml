    examples: |
      - I'm feeling anxious
      - I feel nervous all the time
      - I'm really worried
      - Anxiety is overwhelming
      - I feel so anxious
      - My anxiety is getting worse
      - Looking to be supported and support others like me who suffer from panic disorder and depression

  # to sense depression
  - intent: mood_depressed
    examples: |
      - I feel depressed
      - I'm feeling really low
      - I'm in a dark place
      - I don't see the point in anything
      - I'm so down
      - I feel hopeless

  # to sense self harm
  - intent: self_harm
    examples: |
      - I want to hurt myself
      - I feel like ending my life
      - I'm thinking about suicide
      - I can't go on like this
      - I feel so worthless, I want to disappear
